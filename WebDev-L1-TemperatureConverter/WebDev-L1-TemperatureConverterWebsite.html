<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:#fff;
        width:380px;
        padding:25px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,.2);
        text-align:center;
    }

    h2{
        margin-bottom:20px;
        color:#333;
    }

    label{
        display:block;
        text-align:left;
        margin-top:12px;
        margin-bottom:5px;
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:10px;
        font-size:16px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        margin-top:20px;
        padding:12px;
        background:#007BFF;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#0056b3;
    }

    #error{
        color:red;
        margin-top:10px;
        font-weight:bold;
    }

    #result{
        margin-top:20px;
        background:#f0f8ff;
        padding:15px;
        border-radius:5px;
        text-align:left;
        line-height:1.8;
    }
</style>

</head>
<body>

<div class="container">

<h2>Temperature Converter</h2>

<label>Temperature</label>
<input type="text" id="temp" placeholder="Enter temperature">

<label>Input Unit</label>
<select id="unit">
    <option value="C">Celsius (°C)</option>
    <option value="F">Fahrenheit (°F)</option>
    <option value="K">Kelvin (K)</option>
</select>

<button onclick="convertTemperature()">Convert</button>

<div id="error"></div>

<div id="result"></div>

</div>

<script>

function convertTemperature(){

    let value = document.getElementById("temp").value.trim();
    let unit = document.getElementById("unit").value;

    let error = document.getElementById("error");
    let result = document.getElementById("result");

    error.innerHTML="";
    result.innerHTML="";

    // Numeric validation
    if(value==="" || isNaN(value)){
        error.innerHTML="Please enter a valid numeric temperature.";
        return;
    }

    value = parseFloat(value);

    // Convert input to Celsius
    let celsius;

    if(unit==="C"){
        celsius=value;
    }
    else if(unit==="F"){
        celsius=(value-32)*5/9;
    }
    else{
        celsius=value-273.15;
    }

    // Absolute zero validation
    if(celsius < -273.15){
        error.innerHTML="Temperature cannot be below absolute zero (-273.15°C).";
        return;
    }

    // Convert to all units
    let fahrenheit=(celsius*9/5)+32;
    let kelvin=celsius+273.15;

    result.innerHTML=`
        <strong>Converted Temperatures</strong><br><br>
        Celsius: ${celsius.toFixed(2)} °C<br>
        Fahrenheit: ${fahrenheit.toFixed(2)} °F<br>
        Kelvin: ${kelvin.toFixed(2)} K
    `;
}

</script>

</body>
</html>
